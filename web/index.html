<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jev / Cờ caro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@500;600;700;800&display=swap');

    :root { --paper:#f6f1e8; --ink:#18212b; --muted:#68717a; --line:#c9c2b7; --blue:#145d9f; --blue-wash:#deecf7; --orange:#d65524; --orange-wash:#f9e2d8; --green:#2e714d; --code:#202a35; --code-ink:#e9e5d9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Manrope,sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; }

    .topbar { border-bottom:1px solid var(--ink); }
    .topbar-inner { max-width:1400px; min-height:72px; margin:auto; padding:13px clamp(18px,4vw,54px); display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand { display:flex; align-items:baseline; gap:12px; white-space:nowrap; }
    .brand-tag { color:var(--blue); font:700 10px/1 "DM Mono",monospace; letter-spacing:.13em; }
    h1 { margin:0; font:650 clamp(23px,3vw,34px)/1 Fraunces,serif; letter-spacing:-.04em; }
    .actions { display:flex; align-items:center; justify-content:flex-end; gap:7px; }
    .mini-button, .mini-link { min-height:34px; border:1px solid var(--ink); background:transparent; color:var(--ink); padding:7px 10px; font:700 10px/1 "DM Mono",monospace; letter-spacing:.05em; text-transform:uppercase; }
    .mini-link { display:inline-flex; align-items:center; text-decoration:none; }
    .mini-button:hover, .mini-link:hover { color:var(--paper); background:var(--ink); }

    main { max-width:1400px; margin:auto; padding:clamp(24px,4vw,48px) clamp(18px,4vw,54px) 60px; }
    .workspace { display:grid; grid-template-columns:minmax(0,480px) minmax(0,1fr); gap:clamp(34px,5vw,78px); align-items:start; }
    .board-side { min-width:0; }
    .section-label { display:flex; justify-content:space-between; gap:15px; border-top:2px solid var(--ink); padding-top:10px; margin-bottom:16px; color:var(--ink); font:700 10px/1.3 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    #role-label { color:var(--blue); }
    .board { display:grid; width:100%; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(0,1fr)); aspect-ratio:1; gap:2px; border:2px solid var(--ink); background:var(--ink); overflow:hidden; }
    .cell { min-width:0; min-height:0; border:0; background:var(--paper); color:var(--ink); position:relative; display:grid; place-items:center; font:650 clamp(47px,8vw,94px)/1 Fraunces,serif; transition:background .14s ease,color .14s ease; }
    .cell:enabled:hover { background:var(--orange-wash); }
    .cell:focus-visible { outline:4px solid var(--blue); outline-offset:-5px; z-index:1; }
    .cell.empty::after { content:attr(data-cell); position:absolute; top:8px; left:9px; color:#8b918f; font:500 10px "DM Mono",monospace; letter-spacing:.05em; }
    .cell.x { color:var(--blue); }.cell.o { color:var(--orange); }
    .game-message { margin-top:14px; min-height:54px; border-left:4px solid var(--blue); padding:7px 11px; background:var(--blue-wash); }
    .message-kicker { display:block; color:var(--blue); font:700 10px/1.3 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    #status { display:block; margin-top:2px; font:700 14px/1.42 Manrope,sans-serif; }
    .game-message[data-kind="win"] { border-color:var(--green); background:#dceee2; }.game-message[data-kind="win"] .message-kicker { color:var(--green); }
    .game-message[data-kind="loss"],.game-message[data-kind="error"] { border-color:var(--orange); background:var(--orange-wash); }.game-message[data-kind="loss"] .message-kicker,.game-message[data-kind="error"] .message-kicker { color:var(--orange); }
    .game-message[data-kind="draw"] { border-color:#7b5d14; background:#f5e8bc; }.game-message[data-kind="draw"] .message-kicker { color:#735507; }

    .trace { min-width:0; }
    .trace-head { border-top:2px solid var(--ink); padding:10px 0 15px; display:flex; justify-content:space-between; align-items:center; gap:10px; font:700 10px/1.3 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
    .history-controls { display:flex; align-items:center; gap:7px; } #api-state { color:var(--muted); }
    .copy-all { border:1px solid var(--ink); background:transparent; padding:5px 7px; color:var(--ink); font:700 9px/1 "DM Mono",monospace; letter-spacing:.04em; text-transform:uppercase; }.copy-all:hover:not(:disabled){background:var(--ink);color:var(--paper)}.copy-all:disabled{opacity:.38;cursor:not-allowed;}
    .call { margin-bottom:19px; padding-bottom:19px; border-bottom:1px solid var(--line); }
    .call[hidden] { display:none; }
    .call-meta { display:flex; align-items:baseline; justify-content:space-between; gap:15px; margin-bottom:8px; }
    .call-meta strong { font:650 17px Fraunces,serif; }
    .pill { flex:0 0 auto; padding:3px 6px; background:var(--blue-wash); color:var(--blue); font:700 9px "DM Mono",monospace; letter-spacing:.06em; text-transform:uppercase; }
    .response .pill { background:var(--orange-wash); color:#933714; }
    pre { margin:0; max-height:350px; overflow:auto; padding:15px; border-left:4px solid #798796; background:var(--code); color:var(--code-ink); font:12px/1.55 "DM Mono",monospace; white-space:pre-wrap; word-break:break-word; }
    .response pre { border-color:var(--orange); }.response { display:none; }.response.visible { display:block; }
    .empty-trace { padding:18px 0; color:var(--muted); font-size:13px; line-height:1.6; }
    .api-history { display:grid; gap:9px; }
    .api-item { border:1px solid var(--line); background:color-mix(in srgb, var(--paper) 90%, white); }
    .api-item summary { cursor:pointer; list-style:none; padding:11px 12px; display:flex; justify-content:space-between; gap:12px; font:700 11px/1.3 "DM Mono",monospace; letter-spacing:.03em; }
    .api-item summary::-webkit-details-marker { display:none; }.api-item summary::before { content:"+"; color:var(--blue); margin-right:7px; }.api-item[open] summary::before { content:"−"; }
    .api-item summary span:first-child { flex:1; }.api-item summary em { color:var(--muted); font-style:normal; font-weight:500; }.api-item[open] summary { border-bottom:1px solid var(--line); }
    .api-body { padding:12px; }.api-actions { display:flex; gap:7px; margin:0 0 8px; }.copy-button { border:1px solid var(--ink); background:transparent; padding:5px 7px; color:var(--ink); font:700 9px/1 "DM Mono",monospace; letter-spacing:.04em; text-transform:uppercase; }.copy-button:hover { background:var(--ink); color:var(--paper); }.api-body h3 { margin:11px 0 6px; font:700 10px "DM Mono",monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); }.api-body h3.response-title { color:var(--orange); }

    @media (max-width:960px) { .workspace { grid-template-columns:1fr; gap:38px; }.board-side { max-width:530px; }.trace { max-width:760px; } }
    @media (max-width:560px) { .topbar-inner { align-items:flex-start; flex-direction:column; }.actions { width:100%; justify-content:flex-start; }.mini-button,.improve-control { padding:8px; }.brand { gap:9px; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><span class="brand-tag">JEV / SYSTEM ONE</span><h1>Cờ caro</h1></div>
    <div class="actions">
      <a class="mini-link" href="/gomoku.html">Caro 16×16</a>
      <button id="jev-first" class="mini-button" type="button">Jev đi trước</button>
      <button id="new-game" class="mini-button" type="button">Ván mới ↻</button>
    </div>
  </div></header>

  <main><section class="workspace">
    <div class="board-side">
      <div class="section-label"><span id="role-label">Bạn X · Jev O</span><span id="move-count">0 nước</span></div>
      <div id="board" class="board" aria-label="Bàn cờ caro 3 nhân 3"></div>
      <div class="game-message" id="game-message" data-kind="ready" role="status" aria-live="polite"><span class="message-kicker" id="message-kicker">Sẵn sàng</span><strong id="status">Chọn một ô trống để đánh X.</strong></div>
    </div>

    <div class="trace">
      <div class="trace-head"><span>Lịch sử request</span><span class="history-controls"><span id="api-state">chờ nước đi</span><button id="copy-all" class="copy-all" type="button" disabled>Copy all</button></span></div>
      <div id="trace-empty" class="empty-trace">Mỗi request Jev sẽ được lưu ở đây. Bấm vào một dòng để xem JSON request/response và copy.</div>
      <div id="api-history" class="api-history"></div>
    </div>
  </section></main>

  <script>
    const API_URL = '/api/systemone';
    const CELLS = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
    const LINES = [['A1','A2','A3'],['B1','B2','B3'],['C1','C2','C3'],['A1','B1','C1'],['A2','B2','C2'],['A3','B3','C3'],['A1','B2','C3'],['A3','B2','C1']];
    let board, history, apiHistory, locked, complete, humanMark, jevMark;
    const $ = (id) => document.getElementById(id);
    const pretty = (value) => JSON.stringify(value, null, 2);
    const snapshot = (value) => JSON.parse(JSON.stringify(value));
    const escapeHtml = (text) => text.replace(/[&<>]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[char]));

    function renderApiHistory() {
      $('trace-empty').hidden = apiHistory.length > 0;
      $('copy-all').disabled = apiHistory.length === 0;
      $('api-history').innerHTML = apiHistory.map((entry, index) => {
        const response = entry.response ?? { status:'pending', message:'Đang chờ TypeSafe trả lời.' };
        return `<details class="api-item" ${index === 0 ? 'open' : ''}><summary><span>#${apiHistory.length - index} · ${entry.label}</span><em>${entry.request.model}</em></summary><div class="api-body"><div class="api-actions"><button class="copy-button" data-copy="request" data-index="${index}">Copy request</button><button class="copy-button" data-copy="response" data-index="${index}">Copy response</button></div><h3>Request</h3><pre>${escapeHtml(pretty(entry.request))}</pre><h3 class="response-title">Response · ${entry.status}</h3><pre>${escapeHtml(pretty(response))}</pre></div></details>`;
      }).join('');
    }

    async function copyText(text, button, copiedLabel) {
      try { await navigator.clipboard.writeText(text); }
      catch { const area = document.createElement('textarea'); area.value = text; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); }
      const original = button.textContent; button.textContent = copiedLabel; setTimeout(() => { button.textContent = original; }, 1200);
    }

    async function copyApiPart(index, part, button) { await copyText(pretty(apiHistory[index][part] ?? { status:'pending' }), button, 'Copied ✓'); }
    async function copyAllHistory(button) {
      const ordered = [...apiHistory].reverse().map((entry, index) => ({ sequence:index + 1, label:entry.label, request:entry.request, response:entry.response ?? { status:'pending' }, status:entry.status }));
      await copyText(pretty(ordered), button, 'Copied all ✓');
    }

    function setMessage(message, kind = 'ready') {
      const labels = { ready:'Sẵn sàng', thinking:'Jev đang suy nghĩ', move:'Nước đi của Jev', win:'Kết quả — bạn thắng', loss:'Kết quả — Jev thắng', draw:'Kết quả — hòa', error:'Lỗi kết nối' };
      $('game-message').dataset.kind = kind;
      $('message-kicker').textContent = labels[kind] || labels.ready;
      $('status').textContent = message;
    }

    function reset(jevStarts = false) {
      humanMark = jevStarts ? 'O' : 'X';
      jevMark = jevStarts ? 'X' : 'O';
      board = Object.fromEntries(CELLS.map(cell => [cell, '']));
      history = []; apiHistory = []; locked = jevStarts; complete = false;
      renderApiHistory();
      $('api-state').textContent = 'chờ nước đi';
      setMessage(jevStarts ? 'Jev là X và sẽ đi nước đầu tiên.' : 'Bạn là X. Chọn một ô trống để đánh.');
      render();
      if (jevStarts) setTimeout(playJevTurn, 120);
    }

    function render() {
      const root = $('board'); root.innerHTML = '';
      CELLS.forEach(cell => {
        const mark = board[cell]; const button = document.createElement('button');
        button.className = `cell ${mark ? mark.toLowerCase() : 'empty'}`;
        button.dataset.cell = cell; button.textContent = mark;
        button.disabled = Boolean(mark) || locked || complete;
        button.setAttribute('aria-label', mark ? `Ô ${cell}: ${mark}` : `Đánh ${humanMark} vào ô ${cell}`);
        button.addEventListener('click', () => humanMove(cell)); root.appendChild(button);
      });
      $('role-label').textContent = `Bạn ${humanMark} · Jev ${jevMark}`;
      $('move-count').textContent = `${history.length} nước`;
    }

    function available(candidateBoard = board) { return CELLS.filter(cell => !candidateBoard[cell]); }
    function winnerFor(candidateBoard) { const line = LINES.find(([a,b,c]) => candidateBoard[a] && candidateBoard[a] === candidateBoard[b] && candidateBoard[b] === candidateBoard[c]); return line ? candidateBoard[line[0]] : null; }
    function immediateWinningMoves(mark, candidateBoard = board) { return available(candidateBoard).filter(cell => winnerFor({ ...candidateBoard, [cell]:mark }) === mark); }
    function finish(message, kind) { complete = true; locked = true; setMessage(message, kind); render(); }

    function solveTicTacToe(candidateBoard, turn, cache) {
      const winner = winnerFor(candidateBoard);
      if (winner) return winner === jevMark ? 1 : -1;
      const moves = available(candidateBoard);
      if (!moves.length) return 0;
      const key = `${turn}:${CELLS.map(cell => candidateBoard[cell] || '.').join('')}`;
      if (cache.has(key)) return cache.get(key);
      const scores = moves.map(cell => solveTicTacToe({ ...candidateBoard, [cell]:turn }, turn === jevMark ? humanMark : jevMark, cache));
      const score = turn === jevMark ? Math.max(...scores) : Math.min(...scores);
      cache.set(key, score); return score;
    }
    function outcomeLabel(score) { return score === 1 ? 'FORCED_WIN' : score === 0 ? 'FORCED_DRAW' : 'FORCED_LOSS'; }
    function boardView() { return ['A','B','C'].map((row, rowIndex) => `${row} | ${[1,2,3].map(column => board[`${row}${column}`] || '.').join('')}`); }

    function buildRequest() {
      const ownWins = immediateWinningMoves(jevMark), opponentWins = immediateWinningMoves(humanMark);
      const offeredCells = ownWins.length ? ownWins : opponentWins.length ? opponentWins : available();
      const selectionTier = ownWins.length ? 'immediate_win' : opponentWins.length ? 'block_immediate_win' : 'all_legal_moves';
      const isJevOpening = history.length === 0 && jevMark === 'X';
      const cache = new Map();
      const criteria = Object.fromEntries(offeredCells.map(cell => {
        const afterJev = { ...board, [cell]:jevMark };
        const score = solveTicTacToe(afterJev, humanMark, cache);
        const opponentWinsNext = immediateWinningMoves(humanMark, afterJev);
        const tags = [], evidence = [];
        if (winnerFor(afterJev) === jevMark) { tags.push('WIN_NOW'); evidence.push(`Playing ${jevMark} at ${cell} wins immediately.`); }
        if (opponentWins.includes(cell)) { tags.push('BLOCK_OPPONENT_WIN_NOW'); evidence.push(`Blocks ${humanMark}'s immediate winning move at ${cell}.`); }
        if (opponentWinsNext.length) { tags.push('ALLOWS_OPPONENT_WIN_NEXT'); evidence.push(`${humanMark} can win next at ${opponentWinsNext.join(', ')}.`); }
        if (isJevOpening && cell === 'B2') { tags.push('CENTER_OPENING'); evidence.push('Center belongs to four winning lines.'); }
        return [cell, { legal:true, tactical_tags:tags, forced_outcome:outcomeLabel(score), evidence }];
      }));
      return {
        model:'jev-latest',
        state:{
          game_rules:'Tic-tac-toe on a 3 by 3 board. Three identical marks in a row, column, or diagonal wins.',
          board:{ rows:[[board.A1,board.A2,board.A3],[board.B1,board.B2,board.B3],[board.C1,board.C2,board.C3]], visual_rows:boardView(), visual_legend:"'.' is empty; X and O are stones.", cell_names:'Rows A/B/C top to bottom; columns 1/2/3 left to right.' },
          current_player:jevMark,
          opponent:humanMark,
          move_history:history,
          selection_tier:selectionTier,
          tactical_alerts:{ immediate_winning_cells:{ [jevMark]:ownWins, [humanMark]:opponentWins }, forced_loss_warning:!ownWins.length && opponentWins.length > 1 ? `${humanMark} has multiple immediate winning cells; no single block stops all of them.` : null },
          strategy_policy:[
            'tactical_alerts and tactical_tags are calculated by the game engine and are authoritative.',
            'Choose WIN_NOW before all other moves. If BLOCK_OPPONENT_WIN_NOW is offered, choose one of those cells.',
            'Among remaining moves, prefer FORCED_WIN, then FORCED_DRAW; never choose FORCED_LOSS when a draw or win exists.',
            'For an empty opening board, choose CENTER_OPENING when it is available.',
            'Return only a coordinate in criteria.'
          ]
        },
        questions:{ next_move:{ type:'choice', instructions:'Return exactly one legal coordinate key from criteria. Follow state.tactical_alerts, tactical_tags, and forced_outcome.', criteria } }
      };
    }

    async function playJevTurn() {
      if (complete || !available().length) return;
      locked = true; render(); setMessage('Đang gửi state đến Jev…', 'thinking'); $('api-state').textContent = 'đang gọi API';
      const requestBody = buildRequest();
      // History must keep an immutable request snapshot; board is mutated on later moves.
      const record = { label:`Nước ${history.length + 1} · Jev chọn ô`, request:snapshot(requestBody), response:null, status:'đang gửi' };
      apiHistory.unshift(record); renderApiHistory();
      try {
        const response = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(requestBody) });
        const rawBody = await response.text(); let payload;
        try { payload = rawBody ? JSON.parse(rawBody) : null; } catch { record.response = { error:{ message:rawBody || 'Empty response body' } }; record.status = `HTTP ${response.status} · non-JSON`; renderApiHistory(); throw new Error(`API returned non-JSON data (HTTP ${response.status}).`); }
        record.response = snapshot(payload ?? { error:{ message:'Empty response body' } }); record.status = `HTTP ${response.status}`; renderApiHistory();
        if (!response.ok) throw new Error(payload?.error?.message || `Local endpoint ${location.origin}${API_URL} returned empty HTTP ${response.status}. Open via localhost:8000, not Live Server.`);
        const move = payload?.answers?.next_move?.choice;
        if (!available().includes(move)) throw new Error(`Jev trả về ô không hợp lệ: ${String(move)}`);
        board[move] = jevMark; history.push(`${jevMark}:${move}`);
        const confidence = payload.answers.next_move.confidence; const confidenceText = typeof confidence === 'number' ? ` · confidence ${Math.round(confidence * 100)}%` : '';
        $('api-state').textContent = 'đã nhận response';
        if (winnerFor(board) === jevMark) { finish(`Jev hoàn thành một hàng ${jevMark} với nước ${move}.`, 'loss'); return; }
        if (!available().length) { finish('Không còn ô trống — ván cờ hòa.', 'draw'); return; }
        setMessage(`Jev chọn ${move}${confidenceText}. Đến lượt bạn.`, 'move');
      } catch (error) {
        if (record.status === 'đang gửi') { record.response = { error:{ message:error.message } }; record.status = 'network error'; renderApiHistory(); }
        $('api-state').textContent = 'lỗi API'; complete = true; setMessage(`Không thể nhận nước đi từ Jev: ${error.message}`, 'error');
      } finally { locked = false; render(); }
    }

    async function humanMove(cell) {
      if (locked || complete || board[cell]) return;
      board[cell] = humanMark; history.push(`${humanMark}:${cell}`);
      if (winnerFor(board) === humanMark) { finish(`Bạn đã tạo một hàng ${humanMark}.`, 'win'); return; }
      if (!available().length) { finish('Không còn ô trống — ván cờ hòa.', 'draw'); return; }
      render(); await playJevTurn();
    }

    $('api-history').addEventListener('click', (event) => { const button = event.target.closest('[data-copy]'); if (button) copyApiPart(Number(button.dataset.index), button.dataset.copy, button); });
    $('copy-all').addEventListener('click', (event) => copyAllHistory(event.currentTarget));
    $('new-game').addEventListener('click', () => reset(false));
    $('jev-first').addEventListener('click', () => reset(true));
    reset(false);
  </script>
</body>
</html>
