<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jev / Caro 16×16</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@500;600;700;800&display=swap');
    :root{--paper:#f6f1e8;--ink:#18212b;--muted:#68717a;--line:#c9c2b7;--blue:#145d9f;--bluewash:#deecf7;--orange:#d65524;--orangewash:#f9e2d8;--green:#2e714d;--code:#202a35;--codeink:#e9e5d9}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}button{font:inherit;cursor:pointer}
    header{border-bottom:1px solid var(--ink)}.bar{max-width:1440px;min-height:72px;margin:auto;padding:13px clamp(16px,4vw,56px);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;gap:12px;align-items:baseline}.tag{color:var(--blue);font:700 10px/1 "DM Mono",monospace;letter-spacing:.12em}.brand h1{margin:0;font:650 clamp(22px,3vw,34px)/1 Fraunces,serif;letter-spacing:-.04em}.actions{display:flex;gap:7px;align-items:center}.button,.link{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 10px;font:700 10px/1 "DM Mono",monospace;letter-spacing:.05em;text-transform:uppercase;text-decoration:none}.button:hover,.link:hover{background:var(--ink);color:var(--paper)}
    main{max-width:1440px;margin:auto;padding:clamp(24px,4vw,48px) clamp(16px,4vw,56px) 60px}.layout{display:grid;grid-template-columns:minmax(0,760px) minmax(310px,1fr);gap:clamp(28px,4vw,68px);align-items:start}.label{display:flex;justify-content:space-between;gap:15px;border-top:2px solid var(--ink);padding-top:10px;margin-bottom:14px;font:700 10px/1.3 "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.label span:first-child{color:var(--blue)}
    .board-wrap{position:relative;width:min(100%,760px);padding:17px 0 0 17px}.axis-top{position:absolute;left:17px;right:0;top:0;display:grid;grid-template-columns:repeat(16,1fr);font:500 8px "DM Mono",monospace;color:var(--muted);text-align:center}.axis-left{position:absolute;left:0;top:17px;bottom:0;display:grid;grid-template-rows:repeat(16,1fr);font:500 8px "DM Mono",monospace;color:var(--muted);text-align:center}.axis-left span{display:grid;place-items:center}.board{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));grid-template-rows:repeat(16,minmax(0,1fr));aspect-ratio:1;border:1px solid var(--ink);background:var(--ink);gap:1px}.cell{min-width:0;min-height:0;border:0;background:var(--paper);display:grid;place-items:center;font:650 clamp(12px,3.8vw,34px)/1 Fraunces,serif;transition:background .12s ease}.cell:enabled:hover{background:var(--orangewash)}.cell:focus-visible{outline:3px solid var(--blue);outline-offset:-3px;z-index:1}.cell.x{color:var(--blue)}.cell.o{color:var(--orange)}
    .message{width:min(100%,760px);margin-top:14px;min-height:54px;border-left:4px solid var(--blue);padding:7px 11px;background:var(--bluewash)}.message small{display:block;color:var(--blue);font:700 10px/1.3 "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.message strong{display:block;margin-top:2px;font:700 14px/1.4 Manrope,sans-serif}.message[data-kind=win]{border-color:var(--green);background:#dceee2}.message[data-kind=win] small{color:var(--green)}.message[data-kind=loss],.message[data-kind=error]{border-color:var(--orange);background:var(--orangewash)}.message[data-kind=loss] small,.message[data-kind=error] small{color:var(--orange)}.message[data-kind=draw]{border-color:#7b5d14;background:#f5e8bc}.message[data-kind=draw] small{color:#735507}
    .trace{min-width:0}.trace-head{border-top:2px solid var(--ink);padding:10px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 10px/1.3 "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.trace-head span:last-child{color:var(--muted)}.history-controls{display:flex;align-items:center;gap:7px}.copy-all{border:1px solid var(--ink);background:transparent;padding:5px 7px;color:var(--ink);font:700 9px/1 "DM Mono",monospace;letter-spacing:.04em;text-transform:uppercase}.copy-all:hover:not(:disabled){background:var(--ink);color:var(--paper)}.copy-all:disabled{opacity:.38;cursor:not-allowed}.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.call{padding:0 0 17px;margin:0 0 17px;border-bottom:1px solid var(--line)}.call h2{margin:0 0 7px;font:650 17px Fraunces,serif}.call h2 span{margin-left:7px;color:var(--blue);font:700 9px "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase}.call.response h2 span{color:var(--orange)}pre{margin:0;max-height:280px;overflow:auto;padding:14px;border-left:4px solid #798796;background:var(--code);color:var(--codeink);font:11px/1.55 "DM Mono",monospace;white-space:pre-wrap;word-break:break-word}.response pre{border-color:var(--orange)}
    .api-history{display:grid;gap:9px}.api-item{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 90%,white)}.api-item summary{cursor:pointer;list-style:none;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;font:700 10px/1.3 "DM Mono",monospace;letter-spacing:.03em}.api-item summary::-webkit-details-marker{display:none}.api-item summary::before{content:"+";color:var(--blue);margin-right:7px}.api-item[open] summary::before{content:"−"}.api-item summary span:first-child{flex:1}.api-item summary em{color:var(--muted);font-style:normal;font-weight:500}.api-item[open] summary{border-bottom:1px solid var(--line)}.api-body{padding:12px}.api-actions{display:flex;gap:7px;margin:0 0 8px}.copy-button{border:1px solid var(--ink);background:transparent;padding:5px 7px;color:var(--ink);font:700 9px/1 "DM Mono",monospace;letter-spacing:.04em;text-transform:uppercase}.copy-button:hover{background:var(--ink);color:var(--paper)}.api-body h3{margin:11px 0 6px;color:var(--blue);font:700 10px "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase}.api-body h3.response-title{color:var(--orange)}
    @media(max-width:1040px){.layout{grid-template-columns:1fr}.trace{max-width:760px}}@media(max-width:560px){.bar{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:flex-start}.board-wrap{padding:13px 0 0 13px}.axis-top{left:13px}.axis-left{top:13px}.button,.link{padding:8px}.message strong{font-size:13px}}
  </style>
</head>
<body>
  <header><div class="bar"><div class="brand"><span class="tag">JEV / SYSTEM ONE</span><h1>Caro 16×16</h1></div><nav class="actions"><a class="link" href="/">3×3</a><button class="button" id="jev-first">Jev đi trước</button><button class="button" id="new-game">Ván mới ↻</button></nav></div></header>
  <main><section class="layout"><div><div class="label"><span id="roles">Bạn X · Jev O</span><span id="moves">0 nước</span></div><div class="board-wrap"><div class="axis-top" id="axis-top"></div><div class="axis-left" id="axis-left"></div><div class="board" id="board" aria-label="Bàn cờ caro 16 nhân 16"></div></div><div class="message" id="message" data-kind="ready" role="status" aria-live="polite"><small id="message-label">Sẵn sàng</small><strong id="status">Bạn là X. Đặt quân đầu tiên.</strong></div></div><aside class="trace"><div class="trace-head"><span>Lịch sử request</span><span class="history-controls"><span id="api-state">chờ nước đi</span><button id="copy-all" class="copy-all" type="button" disabled>Copy all</button></span></div><p class="hint" id="empty-trace">Mỗi request của Jev được lưu tại đây. Bấm vào một dòng để mở JSON request/response và copy.</p><div id="trace" class="api-history"></div></aside></section></main>
<script>
const API_URL = '/api/systemone';
const SIZE = 16;
const ROWS = 'ABCDEFGHIJKLMNOP'.split('');
const DIRECTIONS = [[0, 1], [1, 0], [1, 1], [1, -1]];
let board, history, apiHistory, humanMark, jevMark, locked, complete;

const $ = (id) => document.getElementById(id);
const pretty = (value) => JSON.stringify(value, null, 2);
const snapshot = (value) => JSON.parse(JSON.stringify(value));
const cellKey = (r, c) => `${ROWS[r]}${c + 1}`;

function setMessage(text, kind = 'ready') {
  const labels = { ready:'Sẵn sàng', thinking:'Jev đang suy nghĩ', move:'Nước đi của Jev', win:'Kết quả — bạn thắng', loss:'Kết quả — Jev thắng', draw:'Kết quả — hòa', error:'Lỗi kết nối' };
  $('message').dataset.kind = kind; $('message-label').textContent = labels[kind]; $('status').textContent = text;
}
function escapeHtml(text) { return text.replace(/[&<>]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[char])); }
function renderApiHistory() {
  $('empty-trace').hidden = apiHistory.length > 0; $('copy-all').disabled = apiHistory.length === 0;
  $('trace').innerHTML = apiHistory.map((entry, index) => {
    const reply = entry.response ?? { status:'pending', message:'Đang chờ TypeSafe trả lời.' };
    return `<details class="api-item" ${index === 0 ? 'open' : ''}><summary><span>#${apiHistory.length - index} · ${entry.title}</span><em>${entry.request.model}</em></summary><div class="api-body"><div class="api-actions"><button class="copy-button" data-copy="request" data-index="${index}">Copy request</button><button class="copy-button" data-copy="response" data-index="${index}">Copy response</button></div><h3>Request</h3><pre>${escapeHtml(pretty(entry.request))}</pre><h3 class="response-title">Response · ${entry.status}</h3><pre>${escapeHtml(pretty(reply))}</pre></div></details>`;
  }).join('');
}
async function copyText(text, button, label) {
  try { await navigator.clipboard.writeText(text); } catch { const area = document.createElement('textarea'); area.value = text; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); }
  const original = button.textContent; button.textContent = label; setTimeout(() => { button.textContent = original; }, 1200);
}
async function copyApiPart(index, part, button) { await copyText(pretty(apiHistory[index][part] ?? { status:'pending' }), button, 'Copied ✓'); }
async function copyAllHistory(button) {
  const ordered = [...apiHistory].reverse().map((entry, index) => ({ sequence:index + 1, label:entry.title, request:entry.request, response:entry.response ?? { status:'pending' }, status:entry.status }));
  await copyText(pretty(ordered), button, 'Copied all ✓');
}
function reset(jevStarts = false) {
  humanMark = jevStarts ? 'O' : 'X'; jevMark = jevStarts ? 'X' : 'O';
  board = Array.from({ length:SIZE }, () => Array(SIZE).fill('')); history = []; apiHistory = []; locked = jevStarts; complete = false;
  renderApiHistory(); $('api-state').textContent = 'chờ nước đi'; setMessage(jevStarts ? 'Jev là X và sẽ đi nước đầu tiên.' : 'Bạn là X. Đặt quân đầu tiên.'); render(); if (jevStarts) setTimeout(playJevTurn, 120);
}
function render() {
  const root = $('board'); root.innerHTML = '';
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const mark = board[r][c], button = document.createElement('button');
    button.className = `cell ${mark ? mark.toLowerCase() : ''}`; button.disabled = Boolean(mark) || locked || complete; button.textContent = mark;
    button.setAttribute('aria-label', mark ? `${cellKey(r,c)}: ${mark}` : `Đánh ${humanMark} tại ${cellKey(r,c)}`); button.onclick = () => humanMove(r, c); root.append(button);
  }
  $('roles').textContent = `Bạn ${humanMark} · Jev ${jevMark}`; $('moves').textContent = `${history.length} nước`;
}
function inBoard(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }
function empties() { const result = []; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!board[r][c]) result.push([r, c]); return result; }
function winsAt(r, c, mark, testBoard = board) {
  for (const [dr, dc] of DIRECTIONS) {
    let startR = r, startC = c, endR = r, endC = c;
    while (inBoard(startR - dr, startC - dc) && testBoard[startR - dr][startC - dc] === mark) { startR -= dr; startC -= dc; }
    while (inBoard(endR + dr, endC + dc) && testBoard[endR + dr][endC + dc] === mark) { endR += dr; endC += dc; }
    const length = Math.max(Math.abs(endR - startR), Math.abs(endC - startC)) + 1;
    if (length < 5) continue;
    const opponent = mark === 'X' ? 'O' : 'X';
    const before = inBoard(startR - dr, startC - dc) ? testBoard[startR - dr][startC - dc] : null;
    const after = inBoard(endR + dr, endC + dc) ? testBoard[endR + dr][endC + dc] : null;
    if (!(before === opponent && after === opponent)) return true;
  }
  return false;
}
function openingCandidates() { return [[7,7], [7,8], [8,7], [8,8]]; }
function selectMoveCandidates() {
  const cells = empties();
  // A TypeSafe choice accepts at most 255 options. A normal human-first game
  // reaches Jev with exactly 255 empty cells; only the Jev-first opening has 256.
  return cells.length <= 255
    ? { tier:'all_legal_moves', cells }
    : { tier:'opening_center_limit', cells:openingCandidates() };
}
function compactState(extra = {}) {
  const stones = []; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c]) stones.push({ cell:cellKey(r,c), mark:board[r][c] });
  return { game:'16 by 16 Gomoku. Five or more in a row wins unless both ends of the maximal run are blocked by the opponent.', board:{ size:16, stones, coordinate_system:'Rows A-P top to bottom; columns 1-16 left to right.' }, current_player:jevMark, opponent:humanMark, recent_moves:history.slice(-12), ...extra };
}
function moveRequest(selection) {
  // The values below are labels only: no tactical score or per-cell inference is
  // computed in the browser. Jev receives the authoritative stone list and must
  // evaluate the entire position itself.
  const criteria = Object.fromEntries(selection.cells.map(([r,c]) => [cellKey(r,c), `Legal empty cell ${cellKey(r,c)}.`]));
  const instructions = selection.tier === 'opening_center_limit'
    ? `You play ${jevMark} on an empty 16 by 16 Gomoku board. The API permits at most 255 choices, while the empty board has 256 cells, so this request offers the four central legal opening cells only: H8, H9, I8, I9. Choose one offered cell.`
    : `You play ${jevMark} in 16 by 16 Gomoku against ${humanMark}. The sparse board.stones list is authoritative; coordinates use rows A-P from top to bottom and columns 1-16 from left to right. Every currently legal empty cell is offered as a key in criteria. Choose exactly one offered key. Evaluate the whole board yourself in all four directions: horizontal, vertical, diagonal down-right, and diagonal down-left. A maximal run of five or more wins unless BOTH of its ends are occupied by the opponent; a board edge is not an opponent stone. Priority: (1) make a winning move now; (2) prevent ${humanMark}'s winning move now; (3) create or stop forcing open-four threats; (4) create or stop open-three threats; (5) otherwise build connected lines with useful open ends and favor the center. Do not invent stones, coordinates, or moves outside criteria.`;
  return { model:'jev-latest', state:compactState({ decision:'Select one move from the full current set of legal empty cells. The browser validates the returned coordinate before playing it.', selection_tier:selection.tier, legal_move_count:selection.cells.length }), questions:{ next_move:{ type:'choice', instructions, criteria } } };
}
async function callJev(title, request) {
  const record = { title, request:snapshot(request), response:null, status:'đang gửi' }; apiHistory.unshift(record); renderApiHistory();
  try { const response = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(request) }); const raw = await response.text(); let data; try { data = raw ? JSON.parse(raw) : null; } catch { record.response = { error:{ message:raw || 'Empty response' } }; record.status = `HTTP ${response.status} · non-JSON`; renderApiHistory(); throw new Error(`API returned non-JSON data (HTTP ${response.status}).`); } record.response = snapshot(data ?? { error:{ message:'Empty response body' } }); record.status = `HTTP ${response.status}`; renderApiHistory(); if (!response.ok) throw new Error(data?.error?.message || `API returned HTTP ${response.status}.`); return data; } catch (error) { if (record.status === 'đang gửi') { record.response = { error:{ message:error.message } }; record.status = 'network error'; renderApiHistory(); } throw error; }
}
async function playJevTurn() {
  if (complete) return; locked = true; render(); const selection = selectMoveCandidates(); setMessage(`Jev đang chọn trong ${selection.cells.length} ô hợp lệ (${selection.tier})…`, 'thinking'); $('api-state').textContent = 'đang gọi API'; const request = moveRequest(selection);
  try { const answer = await callJev(`Jev chọn ô · ${selection.tier}`, request), move = answer?.answers?.next_move?.choice, match = /^([A-P])(1[0-6]|[1-9])$/.exec(move || ''); if (!match) throw new Error(`Jev trả về ô không hợp lệ: ${String(move)}`); const r = ROWS.indexOf(match[1]), c = Number(match[2]) - 1; if (!selection.cells.some(([rr,cc]) => rr === r && cc === c) || board[r][c]) throw new Error(`Jev chọn ô ngoài action space hoặc ô đã có quân: ${move}`); board[r][c] = jevMark; history.push(`${jevMark}:${move}`); $('api-state').textContent = 'đã nhận response'; if (winsAt(r,c,jevMark)) { finish(`Jev tạo hàng thắng bằng nước ${move}.`, 'loss'); return; } if (!empties().length) { finish('Bàn cờ đã hết ô — hòa.', 'draw'); return; } const confidence = answer.answers.next_move.confidence; setMessage(`Jev đánh ${move}${typeof confidence === 'number' ? ` · confidence ${Math.round(confidence * 100)}%` : ''}. Đến lượt bạn.`, 'move'); } catch (error) { $('api-state').textContent = 'lỗi API'; complete = true; setMessage(`Không thể nhận nước đi từ Jev: ${error.message}`, 'error'); } finally { locked = false; render(); }
}
function finish(text, kind) { complete = true; locked = true; setMessage(text, kind); render(); }
async function humanMove(r, c) { if (locked || complete || board[r][c]) return; board[r][c] = humanMark; history.push(`${humanMark}:${cellKey(r,c)}`); if (winsAt(r,c,humanMark)) { finish(`Bạn tạo hàng thắng bằng nước ${cellKey(r,c)}.`, 'win'); return; } if (!empties().length) { finish('Bàn cờ đã hết ô — hòa.', 'draw'); return; } render(); await playJevTurn(); }
$('trace').onclick = (event) => { const button = event.target.closest('[data-copy]'); if (button) copyApiPart(Number(button.dataset.index), button.dataset.copy, button); };
$('copy-all').onclick = (event) => copyAllHistory(event.currentTarget);
$('new-game').onclick = () => reset(false); $('jev-first').onclick = () => reset(true);
$('axis-top').innerHTML = Array.from({ length:16 }, (_, i) => `<span>${i + 1}</span>`).join(''); $('axis-left').innerHTML = ROWS.map((row) => `<span>${row}</span>`).join(''); reset(false);
</script>
</body></html>
